[project]
name = "gramstack"
version = "0.1.0"
description = "GramStack"
authors = [{ name = "Guro Bokum", email = "jiojiajiu@gmail.com" }]
requires-python = ">=3.13,<3.14"
readme = "README.md"
license = "MIT"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.40,<3",
    "fastapi>=0.115.12,<0.116",
    "asyncpg>=0.30.0,<0.31",
    "structlog>=25.2.0,<26",
    "pydantic[email]>=2.11.3,<3",
    "pydantic-settings>=2.9.1,<3",
    "uvicorn[standard]>=0.34.2,<0.35",
    "cryptography>=50.0.0,<51",
    "python-telegram-bot>=22.0,<23",
    "authlib>=1.5.2,<2",
    "arq[watch]>=0.26.3,<0.27",
    "ruamel-yaml>=0.18.10,<0.19",
    "langchain>=0.3.25,<0.4",
    "langchain-openai>=0.3.16,<0.4",
    "rich>=14.0.0,<15",
    "logfire[fastapi, sqlalchemy]>=3.16.0,<4",
    "boto3<1.36.4",
    "types-boto[boto3, s3]>=2.49.18.20241019,<3",
    "dishka>=1.6.0,<2",
    "redis[hiredis]>=5.3.1",
    "posthog>=7.45.3",
    "uuid-utils>=0.17.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0,<2",
    "ruff>=0.11.7,<0.12",
    "taskipy>=1.14.1,<2",
    "alembic>=1.15.2,<2",
    "alembic-postgresql-enum>=1.7.0,<2",
    "types-boto3[boto3, s3]==1.36.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-dotenv>=0.5.2",
]

[tool.uv]
package = false
default-groups = "all"

[tool.taskipy.tasks]
dev = "uvicorn app.server:app --reload --reload-include .env"
worker = "watchfiles --filter python 'arq app.worker.WorkerSettings'"
lint = "ruff format --check . && ruff check --diff"
format = "ruff format"
mypy = "mypy ."
test = "pytest"
test_cov = "pytest --cov --cov-report=term-missing"
makemigrations = "alembic revision --autogenerate -m"
migrate = "alembic upgrade head"
printmigrations = "./scripts/print_migrations.sh"
generate_openapi = "python -m scripts.generate_openapi"
generate_i18n = "python -m scripts.generate_i18n"
pre_lint = "task generate_i18n"
pre_mypy = "task generate_i18n"
pre_dev = "task generate_i18n"
pre_worker = "task generate_i18n"
pre_test = "task generate_i18n"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
env_files = [".env.test"]
env_override_existing_values = 1

[tool.coverage.run]
source = ["app"]
branch = true

[tool.mypy]
# https://mypy.readthedocs.io/en/latest/config_file.html
strict_optional = true
show_error_codes = true
show_column_numbers = true
implicit_reexport = false
disallow_any_unimported = false
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_no_return = true
warn_return_any = true
warn_unused_configs = true
strict_equality = true
exclude = ["^examples/", "legacy/"]

[[tool.mypy.overrides]]
module = ["telethon.*", "authlib.*", "langchain_google_community.*"]
ignore_missing_imports = true

[tool.ruff]
# https://docs.astral.sh/ruff/configuration
line-length = 88 # default
indent-width = 4

[tool.ruff.lint]
extend-select = ["B", "I", "SIM", "UP"]
ignore = ["F401"]

[tool.ruff.format]
indent-style = "space"
